model:
  # Primary model (HuggingFace ViT — downloads automatically on first use)
  hf_model_id: "EdBianchi/vit-fire-detection"
  hf_label_map:
    fire: FIRE
    non_fire: NO_EVENT

  # Phase 2 supported events
  # VIOLENCE, ACCIDENT, CROWD_ANOMALY → PLANNED (future phases with appropriate datasets)
  supported_events:
    - FIRE
    - NO_EVENT

  # Detection threshold (below this = NO_EVENT)
  confidence_threshold: 0.55

  # Fallback strategy when HuggingFace model unavailable
  fallback: "color_based"   # "color_based" | "demo"

preprocessing:
  # Max frames sampled from a video clip
  max_frames: 8
  # Model input resolution
  frame_size: [224, 224]
  # Supported MIME types
  image_types: ["image/jpeg", "image/png", "image/bmp", "image/webp"]
  video_types: ["video/mp4", "video/avi", "video/quicktime", "video/x-msvideo"]

color_detector:
  # HSV ranges for fire pixel detection
  # Format: [[H_low, S_low, V_low], [H_high, S_high, V_high]]
  fire_ranges:
    - lower: [0,   100, 100]
      upper: [25,  255, 255]   # orange-red (core flame)
    - lower: [25,  100, 200]
      upper: [35,  255, 255]   # bright yellow (high flame)
  # Pixels-to-confidence scaling factor
  scaling_factor: 20

dataset_note: |
  Phase 2 fire detection is based on:
  1. HuggingFace model: EdBianchi/vit-fire-detection
     - Trained on fire/non-fire image classification dataset
     - Binary classes: fire (→ FIRE), non_fire (→ NO_EVENT)
  2. Fallback: HSV color analysis (no ML needed)
  
  NOT SUPPORTED in Phase 2 (separate models/datasets required):
  - VIOLENCE  → Planned: RWF-2000 dataset + action recognition model
  - ACCIDENT  → Planned: UCF-Crime dataset + anomaly detection
  - CROWD_ANOMALY → Planned: crowd counting/density model
