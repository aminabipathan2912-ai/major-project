system:
  name: "Live Multimodal Monitoring System for Public Safety"
  version: "0.1.0"
  description: >
    Integrates video, audio, text and sensor data, independently analyses each
    modality, combines evidence through multimodal fusion, detects public-safety
    incidents, and provides real-time alerts and situational awareness.
  debug: false
  data_retention_days: 30
  demo_mode: true

database:
  # Override via DATABASE_URL environment variable or .env
  url: "sqlite+aiosqlite:///./data/monitoring.db"
  sync_url: "sqlite:///./data/monitoring.db"  # for Alembic migrations
  echo: false

server:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  cors_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://localhost:8000"
    - "http://127.0.0.1:8000"

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  file: "logs/system.log"
  max_bytes: 10485760   # 10 MB
  backup_count: 5
